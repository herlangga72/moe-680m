[package]
name = "moe-680m"
version = "0.2.0"
edition = "2021"

[dependencies]
ash = "0.38"
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gigatoken = "0.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
futures = "0.3"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[patch.crates-io]
gigatoken = { path = "stubs/gigatoken" }

[[bin]]
name = "moe-680m"
path = "src/main.rs"
