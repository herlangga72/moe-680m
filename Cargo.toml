[package]
name = "moe-680m"
version = "0.1.0"
edition = "2021"

[features]
default = []
gigatoken = []
server = ["dep:serde", "dep:serde_json"]

[dependencies]
ash = "0.38"
memmap2 = "0.9"
bytemuck = { version = "1.15", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
lto = true
codegen-units = 1
